<div class="container">
<h1>🔐 Base64 編碼解碼器</h1>
<p class="sub">支援 UTF-8 中文 · 完全離線</p>
<div class="section">
<h3>📝 輸入</h3>
<textarea id="input" placeholder="輸入要編碼或解碼的內容..."></textarea>
<div class="toolbar" style="margin-top:12px;margin-bottom:0;">
<button class="btn btn-primary" onclick="doEncode()">編碼為 Base64</button>
<button class="btn btn-primary" onclick="doDecode()">解碼 Base64</button>
<button class="btn btn-secondary" onclick="doCopy()">複製結果</button>
<button class="btn btn-secondary" onclick="doClear()">清空</button>
</div>
</div>
<div class="section">
<h3>📤 輸出</h3>
<textarea id="output" readonly placeholder="結果會出現在這裡..."></textarea>
</div>
<div class="msg" id="msg" style="display:none;"></div>
</div>
<script>
function $(id){return document.getElementById(id);}
function showMsg(text, ok){
  var m = $("msg");
  m.textContent = text;
  m.className = "msg " + (ok ? "ok" : "err");
  m.style.display = "block";
}
function doEncode(){
  try {
    var text = $("input").value;
    var bytes = new TextEncoder().encode(text);
    var binary = "";
    for (var i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
    $("output").value = btoa(binary);
    showMsg("✅ 編碼成功", true);
  } catch(e) { showMsg("❌ 編碼失敗：" + e.message, false); }
}
function doDecode(){
  try {
    var b64 = $("input").value.trim();
    var binary = atob(b64);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    $("output").value = new TextDecoder().decode(bytes);
    showMsg("✅ 解碼成功", true);
  } catch(e) { showMsg("❌ 解碼失敗：" + e.message, false); }
}
function doCopy(){
  var out = $("output").value;
  if (!out) { showMsg("⚠️ 沒有內容可複製", false); return; }
  navigator.clipboard.writeText(out).then(function(){
    showMsg("✅ 已複製", true);
  }).catch(function(){
    $("output").select();
    document.execCommand("copy");
    showMsg("✅ 已複製", true);
  });
}
function doClear(){
  $("input").value = "";
  $("output").value = "";
  $("msg").style.display = "none";
}
</script>
