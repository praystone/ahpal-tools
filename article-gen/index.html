<h1>📝 文章生成器入口</h1>

<div class="card">
  <label>分類（決定目錄）</label>
  <select id="category">
    <option value="history">📜 歷史腦洞</option>

    <option value="travel">🧳 旅遊攻略</option>
    <option value="food">🍜 美食探索</option>
  </select>
  <label>標題（一行一題，B 風格：自然、有故事、有畫面）</label>
  <textarea id="titles" placeholder="那個永遠亮著的綠燈，某天變灰了&#10;公會會長退坑那天，大家在線上拍了張照&#10;那間網咖的鍵盤，空白鍵是壞的" style="min-height:200px;"></textarea>
  <div>
    <button onclick="generate()">🚀 產出 PowerShell 陣列</button>
    <button class="blue" onclick="copyResult()">📋 複製結果</button>
    <button class="gray" onclick="clearAll()">🧹 清空</button>
  </div>
  <div class="tip">💡 貼上標題後按「產出」，會自動產生 PowerShell 陣列格式，直接貼進 <code>titles\{分類}-00X.txt</code> 或批次腳本。</div>
</div>

<script>
function slugify(s){
  return s.toLowerCase().replace(/[^a-z0-9\s-]/g, '').replace(/\s+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '') || 'article';
}
function generate(){
  var cat = document.getElementById('category').value;
  var titles = document.getElementById('titles').value.split('\n').map(function(t){return t.trim();}).filter(function(t){return t;});
  if(titles.length === 0){ alert('請至少輸入一行標題'); return; }
  var lines = [];
  titles.forEach(function(t, i){
    var fn = slugify(t);
    lines.push(t + '|' + fn + '.html');
  });
  document.getElementById('output').textContent = lines.join('\n');
}
function copyResult(){
  var t = document.getElementById('output').textContent;
  if(!t || t.indexOf('（按') === 0){ alert('請先產出結果'); return; }
  navigator.clipboard.writeText(t);
  alert('已複製 ' + t.split('\n').length + ' 行');
}
function clearAll(){
  document.getElementById('titles').value = '';
  document.getElementById('output').textContent = '（按「產出」後，結果會出現在這裡）';
}
</script>
