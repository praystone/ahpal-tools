        function applyArticleTemplate() {
            const doc = previewFrame.contentDocument || previewFrame.contentWindow.document;
            const templateCSS = "body{font-family:'Microsoft JhengHei','Segoe UI',sans-serif;padding:48px;max-width:720px;margin:0 auto;line-height:1.9;color:#E6EDF3;background:#0D1117;}"
                + "h1{color:#D4AF37;border-left:5px solid #D4AF37;padding-left:16px;font-size:1.6rem;margin:0 0 8px;}"
                + "h2{color:#58A6FF;font-size:1.2rem;margin:32px 0 12px;padding-bottom:6px;border-bottom:1px solid #2D303A;}"
                + "h3{color:#D4AF37;font-size:1.05rem;margin:24px 0 10px;}"
                + "p{color:#C9D1D9;margin-bottom:14px;}"
                + "a{color:#58A6FF;text-decoration:none;}a:hover{text-decoration:underline;}"
                + "blockquote{background:rgba(212,175,55,0.06);border-left:4px solid #D4AF37;padding:16px 20px;margin:20px 0;color:#E6EDF3;border-radius:6px;}"
                + "code{background:#161B22;color:#58A6FF;padding:2px 8px;border-radius:4px;font-family:Consolas,monospace;font-size:0.9em;}"
                + "pre{background:#161B22;border:1px solid #2D303A;border-radius:8px;padding:16px;overflow-x:auto;}pre code{background:none;padding:0;}"
                + "ul,ol{color:#C9D1D9;padding-left:24px;margin-bottom:16px;}li{margin-bottom:6px;}"
                + "table{width:100%;border-collapse:collapse;margin:16px 0;}"
                + "th{background:rgba(212,175,55,0.12);color:#D4AF37;padding:10px 14px;border:1px solid #2D303A;text-align:left;}"
                + "td{padding:10px 14px;border:1px solid #2D303A;color:#C9D1D9;}"
                + "hr{border:none;border-top:1px solid #2D303A;margin:24px 0;}"
                + "img{max-width:100%;height:auto;border-radius:8px;}";
            let styleTag = doc.getElementById('ahpal-article-template');
            if (!styleTag) {
                styleTag = doc.createElement('style');
                styleTag.id = 'ahpal-article-template';
                doc.head.appendChild(styleTag);
            }
            styleTag.textContent = templateCSS;
            doc.body.style.background = '#0D1117';
            doc.body.style.color = '#E6EDF3';
            updateEditorFromPreview(doc);
            alert('✅ 已套用雅寶文章模板\n\n標題金色、正文淺色、背景黑、引用金邊。只套樣式，不動內容。');
        }

        function exportHighlights() {
            const doc = previewFrame.contentDocument || previewFrame.contentWindow.document;
            const spans = doc.querySelectorAll('span[style*="background-color: rgb(212, 175, 55)"], span[style*="background-color:#D4AF37"], span[style*="background-color: #D4AF37"]');
            if (spans.length === 0) {
                alert('⚠️ 目前沒有螢光標註。\n\n用法：在右側選取文字 → 按 ⌘+H 或 Alt+H 加上螢光筆，再回來匯出。');
                return;
            }
            const lines = ['## 螢光重點', ''];
            spans.forEach((s, i) => {
                const text = s.textContent.trim();
                if (text) lines.push((i + 1) + '. ' + text);
            });
            const markdown = lines.join('\n');
            navigator.clipboard.writeText(markdown).then(() => {
                alert('✅ 已複製 ' + spans.length + ' 條螢光重點到剪貼簿\n\n內容：\n' + markdown.slice(0, 300) + (markdown.length > 300 ? '...' : ''));
            }).catch(() => { prompt('複製失敗，請手動複製：', markdown); });
        }

        function copyCleanHTML() {
            const doc = previewFrame.contentDocument || previewFrame.contentWindow.document;
            const clone = doc.documentElement.cloneNode(true);
            clone.querySelectorAll('[contenteditable]').forEach(el => el.removeAttribute('contenteditable'));
            clone.querySelectorAll('span[style*="background-color"]').forEach(span => {
                const text = doc.createTextNode(span.textContent);
                span.parentNode.replaceChild(text, span);
            });
            const templateStyle = clone.querySelector('#ahpal-article-template');
            if (templateStyle) templateStyle.remove();
            const fullHTML = '<!DOCTYPE html>\n' + clone.outerHTML;
            navigator.clipboard.writeText(fullHTML).then(() => {
                alert('✅ 已複製乾淨 HTML（' + fullHTML.length + ' 字元）\n\n已移除：contenteditable、螢光筆 span、編輯器注入的 style。');
            }).catch(() => { prompt('複製失敗，請手動複製：', fullHTML); });
        }

        const previewFrame = document.getElementById('preview-frame');
        const editorSide = document.getElementById('editor-side');
        const resizer = document.getElementById('resizer');
        const mainContainer = document.getElementById('main-container');
        const previewSide = document.getElementById('preview-side');
        let isMobile = false;
        let syncLocked = false;

        const editor = CodeMirror.fromTextArea(document.getElementById('code-input'), {
            mode: "htmlmixed", theme: "neo", lineNumbers: true, lineWrapping: true, indentUnit: 4
        });

        editor.setValue(`<!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: 'Segoe UI', sans-serif; padding: 48px; max-width: 720px; margin: 0 auto; line-height: 1.85; color: #E6EDF3; background: #0D1117; }
  h1 { color: #D4AF37; border-left: 5px solid #D4AF37; padding-left: 16px; font-size: 1.5rem; margin-bottom: 6px; }
  .subtitle { color: #8B949E; font-size: 0.88rem; margin-bottom: 36px; padding-left: 21px; }
  h2 { font-size: 1rem; color: #58A6FF; margin: 28px 0 10px; }
  ul { padding-left: 20px; margin: 0 0 8px; }
  ul li { margin-bottom: 6px; font-size: 0.95rem; color: #C9D1D9; }
  .tag { display: inline-block; background: rgba(212,175,55,0.15); color: #D4AF37; font-size: 0.78rem; font-weight: 700; padding: 2px 10px; border-radius: 20px; margin-right: 4px; vertical-align: middle; }
  .highlight { background-color: #D4AF37; color: #0D1117; padding: 2px 6px; border-radius: 4px; font-weight: 600; }
  .cta { margin-top: 40px; padding: 24px 28px; background: #161B22; border: 1px solid #2D303A; border-radius: 10px; font-size: 0.93rem; color: #C9D1D9; }
  .cta a { color: #D4AF37; font-weight: 700; text-decoration: underline; }
</style>
</head>
<body>
  <h1>視覺化 HTML 編輯器</h1>
  <p class="subtitle">雅寶社區 · 頂客論壇 · 工具箱 · 龍蝦總工程師維護</p>
  <h2>✦ 工具功能一覽</h2>
  <ul>
    <li><span class="tag">即時預覽</span> 左側輸入代碼，右側<span class="highlight">同步渲染</span>，不需重新整理</li>
    <li><span class="tag">雙向同步</span> 直接在右側修改文字，左側 HTML 代碼同步更新</li>
    <li><span class="tag">代碼追蹤</span> 選取右側文字，左側自動跳轉並標記對應位置</li>
    <li><span class="tag">螢光筆</span> 選取右側文字，按 <span class="highlight">⌘+H</span> 或 Alt+H 加上螢光標註</li>
    <li><span class="tag">手機預覽</span> 一鍵切換 375px 手機框，模擬行動裝置版面</li>
    <li><span class="tag">下載截圖</span> 將右側預覽畫面輸出為 PNG，方便存檔</li>
    <li><span class="tag">複製代碼</span> 一鍵複製完整 HTML，直接貼進你的專案</li>
  </ul>
  <div class="cta">
    🦞 由 <a href="https://www.ahpal.com/">雅寶社區 · 頂客論壇</a> 龍蝦總工程師維護。貼上 AI 生成的文章 HTML，直接在右側微調，改完按「複製代碼」帶走。
  </div>
</body>
</html>`);

        function updatePreview() {
            if (syncLocked) return;
            syncLocked = true;
            const doc = previewFrame.contentDocument || previewFrame.contentWindow.document;
            doc.open(); doc.write(editor.getValue()); doc.close();
            doc.body.contentEditable = 'true';
            doc.body.style.outline = 'none';
            doc.body.oninput = () => { updateEditorFromPreview(doc); };
            doc.onkeydown = (e) => {
                const isH = e.key.toLowerCase() === 'h';
                if ((e.metaKey || e.altKey) && isH) { e.preventDefault(); applyHighlightFromKey(doc); }
            };
            doc.onselectionchange = () => {
                const sel = previewFrame.contentWindow.getSelection();
                if (!sel.isCollapsed && sel.toString().length > 2) {
                    const cursor = editor.getSearchCursor(sel.toString().trim());
                    if (cursor.findNext()) {
                        editor.setSelection(cursor.from(), cursor.to());
                        editor.scrollIntoView({from: cursor.from(), to: cursor.to()}, 250);
                    }
                }
            };
            syncLocked = false;
        }

        function applyHighlightFromKey(doc) {
            const sel = previewFrame.contentWindow.getSelection();
            if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return;
            const range = sel.getRangeAt(0);
            const parent = range.commonAncestorContainer;
            const spanNode = parent.nodeType === 1 ? parent : parent.parentElement;
            const isHighlighted = spanNode && spanNode.tagName === 'SPAN' && spanNode.style.backgroundColor === 'rgb(212, 175, 55)';
            if (isHighlighted) {
                const textNode = doc.createTextNode(spanNode.textContent);
                spanNode.parentNode.replaceChild(textNode, spanNode);
                sel.removeAllRanges();
            } else {
                const span = doc.createElement('span');
                span.style.backgroundColor = '#D4AF37';
                span.style.color = '#0D1117';
                span.style.padding = '2px 4px';
                span.style.borderRadius = '4px';
                span.style.fontWeight = '500';
                try { range.surroundContents(span); } catch (e) { console.warn("選取範圍過於複雜"); }
            }
            updateEditorFromPreview(doc);
        }

        function updateEditorFromPreview(doc) {
            if (syncLocked) return;
            syncLocked = true;
            const cloneBody = doc.body.cloneNode(true);
            cloneBody.removeAttribute('contenteditable');
            const fullHTML = `<!DOCTYPE html>\n<html>\n<head>\n${doc.head.innerHTML}\n</head>\n<body>\n${cloneBody.innerHTML}\n</body>\n</html>`;
            const scroll = editor.getScrollInfo();
            const cursor = editor.getCursor();
            editor.setValue(fullHTML);
            editor.scrollTo(scroll.left, scroll.top);
            editor.setCursor(cursor);
            syncLocked = false;
        }

        function copyCode() {
            navigator.clipboard.writeText(editor.getValue()).then(() => {
                const btn = document.getElementById('btn-copy');
                btn.innerText = '已複製！';
                setTimeout(() => { btn.innerText = '複製代碼'; }, 1500);
            });
        }

        function openInNewTab() {
            const win = window.open();
            win.document.write(editor.getValue()); win.document.close();
        }

        function downloadPreviewImage() {
            const doc = previewFrame.contentDocument;
            const was = doc.body.contentEditable; doc.body.contentEditable = 'false';
            html2canvas(doc.documentElement, { scale: 2, useCORS: true }).then(canvas => {
                const a = document.createElement('a'); a.download = `ahpal-html-editor-${Date.now()}.png`;
                a.href = canvas.toDataURL(); a.click(); doc.body.contentEditable = was;
            });
        }

        function clearAll() { if(confirm('清除所有內容？')) { editor.setValue(''); updatePreview(); } }
        function toggleView() {
            isMobile = !isMobile;
            const btn = document.getElementById('view-toggle');
            previewSide.classList.toggle('mobile-mode');
            btn.innerText = isMobile ? '電腦版預覽' : '手機版預覽';
        }

        let isResizing = false;
        resizer.addEventListener('mousedown', () => { isResizing = true; resizer.classList.add('dragging'); });
        document.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            let offset = (e.clientX / mainContainer.offsetWidth) * 100;
            if (offset > 15 && offset < 85) { editorSide.style.width = `${offset}%`; editor.refresh(); }
        });
        document.addEventListener('mouseup', () => { isResizing = false; resizer.classList.remove('dragging'); });
        editor.on('change', () => { if (!syncLocked) setTimeout(updatePreview, 500); });
        updatePreview();
    </script>
