    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        const previewFrame = document.getElementById('preview-frame');
        const editorSide = document.getElementById('editor-side');
        const resizer = document.getElementById('resizer');
        const mainContainer = document.getElementById('main-container');
        const previewSide = document.getElementById('preview-side');
        
        let isMobile = false;
        let syncLocked = false;

        const editor = CodeMirror.fromTextArea(document.getElementById('code-input'), {
            mode: "htmlmixed",
            theme: "neo",
            lineNumbers: true,
            lineWrapping: true,
            indentUnit: 4
        });

        // 預設內容
        editor.setValue(`<!DOCTYPE html>
<html>
<head>
<style>
  body {
    font-family: 'Segoe UI', sans-serif;
    padding: 48px;
    max-width: 720px;
    margin: 0 auto;
    line-height: 1.85;
    color: #333;
    background: #fff;
  }
  h1 {
    color: #697861;
    border-left: 5px solid #697861;
    padding-left: 16px;
    font-size: 1.5rem;
    margin-bottom: 6px;
  }
  .subtitle {
    color: #888;
    font-size: 0.88rem;
    margin-bottom: 36px;
    padding-left: 21px;
  }
  h2 {
    font-size: 1rem;
    color: #444;
    margin: 28px 0 10px;
  }
  ul {
    padding-left: 20px;
    margin: 0 0 8px;
  }
  ul li {
    margin-bottom: 6px;
    font-size: 0.95rem;
    color: #555;
  }
  .tag {
    display: inline-block;
    background: #DFE5DC;
    color: #697861;
    font-size: 0.78rem;
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 20px;
    margin-right: 4px;
    vertical-align: middle;
  }
  .highlight {
    background-color: #fff176;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 600;
  }
  .cta {
    margin-top: 40px;
    padding: 24px 28px;
    background: #f7f9f6;
    border: 1px solid #DFE5DC;
    border-radius: 10px;
    font-size: 0.93rem;
    color: #555;
  }
  .cta a {
    color: #697861;
    font-weight: 700;
    text-decoration: underline;
  }
</style>
</head>
<body>

  <h1>視覺化 HTML 編輯器</h1>
  <p class="subtitle">雅寶社區 · 頂客論壇 · 工具箱</p>

  <h2>✦ 工具功能一覽</h2>
  <ul>
    <li><span class="tag">即時預覽</span> 左側輸入代碼，右側<span class="highlight">同步渲染</span>，不需重新整理</li>
    <li><span class="tag">雙向同步</span> 直接在右側修改文字，左側 HTML 代碼同步更新</li>
    <li><span class="tag">代碼追蹤</span> 選取右側文字，左側自動跳轉並標記對應位置</li>
    <li><span class="tag">手機預覽</span> 一鍵切換 375px 手機框，模擬行動裝置版面</li>
    <li><span class="tag">下載截圖</span> 將右側預覽畫面輸出為 PNG，方便存檔或給客戶確認</li>
    <li><span class="tag">複製代碼</span> 一鍵複製完整 HTML，直接貼進你的專案</li>
  </ul>

  </body>
</html>`);

        function updatePreview() {
            if (syncLocked) return;
            syncLocked = true;
            const doc = previewFrame.contentDocument || previewFrame.contentWindow.document;
            doc.open(); doc.write(editor.getValue()); doc.close();
            doc.body.contentEditable = 'true';
            doc.body.style.outline = 'none';

            doc.body.oninput = () => { updateEditorFromPreview(doc); };

            doc.onkeydown = (e) => {
                const isH = e.key.toLowerCase() === 'h';
                if ((e.metaKey || e.altKey) && isH) {
                    e.preventDefault();
                    applyHighlightFromKey(doc);
                }
            };

            doc.onselectionchange = () => {
                const sel = previewFrame.contentWindow.getSelection();
                if (!sel.isCollapsed && sel.toString().length > 2) {
                    const cursor = editor.getSearchCursor(sel.toString().trim());
                    if (cursor.findNext()) {
                        editor.setSelection(cursor.from(), cursor.to());
                        editor.scrollIntoView({from: cursor.from(), to: cursor.to()}, 250);
                    }
                }
            };
            syncLocked = false;
        }

        function applyHighlightFromKey(doc) {
            const sel = previewFrame.contentWindow.getSelection();
            if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return;

            const range = sel.getRangeAt(0);

            // 檢查選取範圍是否剛好是一個螢光筆 span
            const parent = range.commonAncestorContainer;
            const spanNode = parent.nodeType === 1 ? parent : parent.parentElement;
            const isHighlighted = spanNode && spanNode.tagName === 'SPAN' && spanNode.style.backgroundColor === 'rgb(255, 241, 118)';

            if (isHighlighted) {
                // 取消：把 span 拆掉，只留文字
                const textNode = doc.createTextNode(spanNode.textContent);
                spanNode.parentNode.replaceChild(textNode, spanNode);
                sel.removeAllRanges();
            } else {
                // 加上螢光筆
                const span = doc.createElement('span');
                span.style.backgroundColor = '#fff176';
                span.style.padding = '2px 4px';
                span.style.borderRadius = '4px';
                span.style.fontWeight = '500';
                try {
                    range.surroundContents(span);
                } catch (e) { console.warn("選取範圍過於複雜"); }
            }

            updateEditorFromPreview(doc);
        }

        function updateEditorFromPreview(doc) {
            if (syncLocked) return;
            syncLocked = true;
            const cloneBody = doc.body.cloneNode(true);
            cloneBody.removeAttribute('contenteditable');
            const fullHTML = `<!DOCTYPE html>\n<html>\n<head>\n${doc.head.innerHTML}\n</head>\n<body>\n${cloneBody.innerHTML}\n</body>\n</html>`;
            const scroll = editor.getScrollInfo();
            const cursor = editor.getCursor();
            editor.setValue(fullHTML);
            editor.scrollTo(scroll.left, scroll.top);
            editor.setCursor(cursor);
            syncLocked = false;
        }

        function copyCode() {
            navigator.clipboard.writeText(editor.getValue()).then(() => {
                const btn = document.getElementById('btn-copy');
                btn.innerText = '已複製！'; btn.classList.add('btn-success');
                setTimeout(() => { btn.innerText = '複製代碼'; btn.classList.remove('btn-success'); }, 1500);
            });
        }

        function openInNewTab() {
            const win = window.open();
            win.document.write(editor.getValue()); win.document.close();
        }

        function downloadPreviewImage() {
            const doc = previewFrame.contentDocument;
            const was = doc.body.contentEditable; doc.body.contentEditable = 'false';
            html2canvas(doc.documentElement, { scale: 2, useCORS: true }).then(canvas => {
                const a = document.createElement('a'); a.download = `McStudio-${Date.now()}.png`;
                a.href = canvas.toDataURL(); a.click(); doc.body.contentEditable = was;
            });
        }

        function clearAll() { if(confirm('清除所有內容？')) { editor.setValue(''); updatePreview(); } }

        function toggleView() {
            isMobile = !isMobile;
            const btn = document.getElementById('view-toggle');
            previewSide.classList.toggle('mobile-mode');
            btn.innerText = isMobile ? '電腦版預覽' : '手機版預覽';
        }

        let isResizing = false;
        resizer.addEventListener('mousedown', () => { isResizing = true; resizer.classList.add('dragging'); });
        document.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            let offset = (e.clientX / mainContainer.offsetWidth) * 100;
            if (offset > 15 && offset < 85) { editorSide.style.width = `${offset}%`; editor.refresh(); }
        });
        document.addEventListener('mouseup', () => { isResizing = false; resizer.classList.remove('dragging'); });

        editor.on('change', () => { if (!syncLocked) setTimeout(updatePreview, 500); });
        updatePreview();
    </script>

</body>
