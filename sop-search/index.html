<div class="container">
<h1>📖 SOP 查詢器</h1>
<p class="sub">雅寶工作 SOP 全文搜尋。輸入關鍵字，即時找到對應章節。</p>

<div class="card">
  <label>搜尋 SOP（中文關鍵字，例如「部署」「拋射」「備份」「教訓」）</label>
  <input type="text" id="q" placeholder="輸入關鍵字..." oninput="search()" style="font-size:16px;">
  <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;">
    <span class="tab" onclick="quick('部署')">部署</span>
    <span class="tab" onclick="quick('拋射')">拋射</span>
    <span class="tab" onclick="quick('備份')">備份</span>
    <span class="tab" onclick="quick('教訓')">教訓</span>
    <span class="tab" onclick="quick('D1')">D1</span>
    <span class="tab" onclick="quick('Worker')">Worker</span>
    <span class="tab" onclick="quick('SOP')">SOP</span>
  </div>
  <div class="tip">共 <span id="total-count">載入中</span> 個章節，搜尋結果即時更新。</div>
</div>

<div id="results" class="card">
  <div style="color:#8B949E;">載入中...</div>
</div>

<div class="footer">
  <p>© 2026 雅寶社區 · 頂客論壇 (AHPAL.COM)</p>
  <p><a href="https://tools.ahpal.com/">← 回到工具箱</a></p>
</div>
</div>
<script>
var SOP_DATA = [];
var allChapters = [];

fetch('sop-data.json').then(function(r){ return r.json(); }).then(function(data){
  SOP_DATA = data;
  data.forEach(function(file){
    file.chapters.forEach(function(ch){
      allChapters.push({ file: file.file, title: ch.title, content: ch.content });
    });
  });
  document.getElementById('total-count').textContent = allChapters.length;
  search();
}).catch(function(e){
  document.getElementById('results').innerHTML = '<div style="color:#F85149;">載入失敗：' + e.message + '</div>';
});

function quick(kw){
  document.getElementById('q').value = kw;
  search();
}

function search(){
  var q = document.getElementById('q').value.trim().toLowerCase();
  var out = document.getElementById('results');
  var list = allChapters;
  if(q){
    list = allChapters.filter(function(ch){
      return (ch.title + ch.content).toLowerCase().indexOf(q) >= 0;
    });
  }
  if(list.length === 0){
    out.innerHTML = '<div style="color:#8B949E;">找不到符合的章節</div>';
    return;
  }
  var html = '<div style="color:#58A6FF;font-weight:700;margin-bottom:12px;">找到 ' + list.length + ' 個章節</div>';
  list.slice(0, 100).forEach(function(ch){
    var preview = ch.content.replace(/\n/g, ' ').substring(0, 150);
    html += '<div class="sop-item" onclick="showDetail(' + JSON.stringify(ch.title).replace(/"/g, '&quot;') + ')">' +
      '<div class="num">' + ch.file + '</div>' +
      '<div class="title">' + ch.title + '</div>' +
      '<div class="preview">' + preview + '...</div>' +
      '</div>';
  });
  if(list.length > 100){
    html += '<div style="color:#8B949E;margin-top:8px;">（只顯示前 100 個）</div>';
  }
  out.innerHTML = html;
}

function showDetail(title){
  var ch = allChapters.find(function(c){ return c.title === title; });
  if(!ch) return;
  var w = window.open('', '_blank');
  w.document.write('<html><head><meta charset="UTF-8"><title>' + title + '</title>');
  w.document.write('<style>body{background:#0D1117;color:#E6EDF3;font-family:-apple-system,"Microsoft JhengHei",sans-serif;padding:20px;line-height:1.8;max-width:1000px;margin:0 auto;}h1{color:#D4AF37;}pre{background:#161B22;padding:16px;border-radius:8px;white-space:pre-wrap;word-break:break-word;}</style>');
  w.document.write('</head><body>');
  w.document.write('<h1>' + title + '</h1>');
  w.document.write('<p style="color:#8B949E;">來源：' + ch.file + '</p>');
  w.document.write('<pre>' + ch.content.replace(/</g, '&lt;') + '</pre>');
  w.document.write('</body></html>');
}
</script>
