<div class="container">
<h1>📧 Email 圖片化（防爬蟲）</h1>
<p class="sub">把 Email 地址轉成圖片，防止爬蟲、機器人抓取你的信箱。純前端 Canvas 繪製，完全離線，不傳送任何資料。</p>

<div class="card">
  <label>Email 地址</label>
  <input type="email" id="email" placeholder="例：name@example.com" value="contact@ahpal.com">
  <div class="row">
    <div>
      <label>字級（px）</label>
      <input type="number" id="fontSize" value="24" min="12" max="72">
    </div>
    <div>
      <label>文字顏色</label>
      <input type="text" id="color" value="#0D1117" placeholder="#0D1117">
    </div>
    <div>
      <label>背景顏色</label>
      <input type="text" id="bg" value="#FFFFFF" placeholder="#FFFFFF">
    </div>
  </div>
  <div>
    <button onclick="render()">🚀 產生圖片</button>
    <button class="blue" onclick="download()">⬇️ 下載 PNG</button>
    <button class="gray" onclick="clearAll()">🧹 清空</button>
  </div>
  <div class="tip">✅ 完全離線：所有繪製都在你的瀏覽器完成，不會傳送任何資料到伺服器。</div>
  <div class="warn">⚠️ 提醒：圖片化能阻擋「簡單爬蟲」，但無法阻擋「OCR 圖片辨識」。高敏感信箱請搭配其他防護。</div>
</div>

<div class="card">
  <label>預覽</label>
  <div class="preview" id="preview">
    <span style="color:#8B949E;">點「產生圖片」後，預覽會出現在這裡</span>
  </div>
</div>

</div>
<script>
var currentCanvas = null;

function render(){
  var email = document.getElementById('email').value.trim();
  if(!email){ alert('請輸入 Email'); return; }
  var fontSize = parseInt(document.getElementById('fontSize').value) || 24;
  var color = document.getElementById('color').value.trim() || '#0D1117';
  var bg = document.getElementById('bg').value.trim() || '#FFFFFF';

  var padding = Math.round(fontSize * 0.8);
  var tmp = document.createElement('canvas');
  var tctx = tmp.getContext('2d');
  var fontStr = 'bold ' + fontSize + 'px -apple-system, "Microsoft JhengHei", Arial, sans-serif';
  tctx.font = fontStr;
  var textWidth = tctx.measureText(email).width;

  var w = Math.ceil(textWidth + padding * 2);
  var h = Math.ceil(fontSize * 1.8 + padding * 0.6);

  var canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  var ctx = canvas.getContext('2d');

  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = color;
  ctx.font = fontStr;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(email, w / 2, h / 2);

  currentCanvas = canvas;
  var preview = document.getElementById('preview');
  preview.innerHTML = '';
  canvas.style.maxWidth = '100%';
  canvas.style.height = 'auto';
  preview.appendChild(canvas);
}

function download(){
  if(!currentCanvas){ alert('請先產生圖片'); return; }
  var email = document.getElementById('email').value.trim();
  var safe = email.replace(/[^a-zA-Z0-9._-]/g, '_');
  var link = document.createElement('a');
  link.download = 'email-' + safe + '.png';
  link.href = currentCanvas.toDataURL('image/png');
  link.click();
}

function clearAll(){
  document.getElementById('email').value = '';
  document.getElementById('preview').innerHTML = '<span style="color:#8B949E;">點「產生圖片」後，預覽會出現在這裡</span>';
  currentCanvas = null;
}

// 頁面載入時自動產生一次
render();
</script>
