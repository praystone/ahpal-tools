<script>
(function(){
  var ZONES = [
    {name:"台北 / 北京", tz:"Asia/Taipei"},
    {name:"東京", tz:"Asia/Tokyo"},
    {name:"首爾", tz:"Asia/Seoul"},
    {name:"新加坡", tz:"Asia/Singapore"},
    {name:"雪梨", tz:"Australia/Sydney"},
    {name:"杜拜", tz:"Asia/Dubai"},
    {name:"倫敦", tz:"Europe/London"},
    {name:"巴黎", tz:"Europe/Paris"},
    {name:"紐約", tz:"America/New_York"},
    {name:"洛杉磯", tz:"America/Los_Angeles"},
    {name:"芝加哥", tz:"America/Chicago"},
    {name:"UTC", tz:"UTC"}
  ];
  function pad(n){return String(n).padStart(2,"0");}
  function render(){
    var el = document.getElementById("world-clock");
    if(!el) return;
    var now = new Date();
    var html = "";
    for(var i=0;i<ZONES.length;i++){
      var z = ZONES[i];
      try{
        var parts = new Intl.DateTimeFormat("en-US",{
          timeZone: z.tz, hour12:false,
          year:"numeric",month:"2-digit",day:"2-digit",
          hour:"2-digit",minute:"2-digit",second:"2-digit"
        }).formatToParts(now);
        var o = {};
        for(var j=0;j<parts.length;j++){ if(parts[j].type!=="literal") o[parts[j].type]=parts[j].value; }
        var timeStr = o.hour + ":" + o.minute + ":" + o.second;
        var dateStr = o.year + "-" + o.month + "-" + o.day;
        var off = new Intl.DateTimeFormat("en-US",{timeZone: z.tz, timeZoneName:"shortOffset"}).formatToParts(now).filter(function(p){return p.type==="timeZoneName";})[0];
        var offStr = off ? off.value : "";
        html += "<div class=\"clock-card\">" +
          "<div class=\"city\">" + z.name + "</div>" +
          "<div class=\"time\">" + timeStr + "</div>" +
          "<div class=\"date\">" + dateStr + "</div>" +
          "<div class=\"offset\">" + offStr + "</div>" +
          "</div>";
      }catch(e){}
    }
    el.innerHTML = html;
  }
  render();
  setInterval(render, 1000);
})();
</script>
<h1>⏱️ Unix 時間戳轉換器</h1>
<p class="sub">Unix 時間戳 ↔ 日期時間互轉，支援秒/毫秒、本地時區、UTC</p>

<div class="card">

<script>
function pad(n){return String(n).padStart(2,'0');}
function fmtLocal(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());}
function fmtUtc(d){return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())+' '+pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())+':'+pad(d.getUTCSeconds())+' UTC';}
function doConvert(){
  var v = document.getElementById('input').value.trim();
  var out = document.getElementById('output');
  if(!v){ out.textContent = '請輸入時間戳或日期'; return; }
  var lines = [];
  if(/^\d+$/.test(v)){
    var n = parseInt(v, 10);
    var ms = (v.length >= 13) ? n : n * 1000;
    window.__lastMs = ms;
    var d = new Date(ms);
    if(isNaN(d.getTime())){ out.textContent = '無法解析'; return; }
    lines.push('原始：' + v);
    lines.push('本地：' + fmtLocal(d));
    lines.push('UTC ：' + fmtUtc(d));
    lines.push('秒  ：' + Math.floor(ms/1000));
    lines.push('毫秒：' + ms);
    lines.push('ISO ：' + d.toISOString());
  } else {
    var d2 = new Date(v.replace(' ', 'T'));
    if(isNaN(d2.getTime())){ out.textContent = '無法解析'; return; }
    var ms2 = d2.getTime();
    window.__lastMs = ms2;
    lines.push('原始：' + v);
    lines.push('本地：' + fmtLocal(d2));
    lines.push('UTC ：' + fmtUtc(d2));
    lines.push('秒  ：' + Math.floor(ms2/1000));
    lines.push('毫秒：' + ms2);
    lines.push('ISO ：' + d2.toISOString());
  }
  out.textContent = lines.join('\n');
}
function doNow(){
  var ms = Date.now();
  document.getElementById('input').value = Math.floor(ms/1000);
  doConvert();
}
function doClear(){ document.getElementById('input').value=''; document.getElementById('output').textContent='（結果會出現在這裡）'; }
</script>
