<h1>🔗 URL 編碼解碼器</h1>
<p class="sub">URL 編碼（encodeURIComponent）與解碼（decodeURIComponent），支援中文、特殊符號</p>

<div class="card">
  <textarea id="input" placeholder="輸入要編碼或解碼的文字 / URL..."></textarea>
  <div>
    <button onclick="doEncode()">🔒 編碼</button>
    <button class="blue" onclick="doDecode()">🔓 解碼</button>
    <button class="gray" onclick="doClear()">🧹 清空</button>
    <button class="blue" onclick="doCopy()">📋 複製結果</button>
  </div>
  <div class="result" id="output">（結果會出現在這裡）</div>
</div>

<script>
function doEncode(){
  try { document.getElementById('output').textContent = encodeURIComponent(document.getElementById('input').value); }
  catch(e) { document.getElementById('output').textContent = '錯誤：' + e.message; }
}
function doDecode(){
  try { document.getElementById('output').textContent = decodeURIComponent(document.getElementById('input').value); }
  catch(e) { document.getElementById('output').textContent = '錯誤：' + e.message; }
}
function doClear(){ document.getElementById('input').value=''; document.getElementById('output').textContent='（結果會出現在這裡）'; }
function doCopy(){ var t=document.getElementById('output').textContent; if(navigator.clipboard){navigator.clipboard.writeText(t);} }
</script>
