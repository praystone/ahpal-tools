<h1>📢 公告欄發布器</h1>
<p class="sub">產生公告發布的 PowerShell 指令，唯讀預覽，不實際發送。複製指令到終端機執行。</p>

<div class="card">
  <label>公告標題</label>
  <input type="text" id="title" placeholder="例：網站維護公告" value="測試公告">
  <label>公告內容</label>
  <textarea id="content" placeholder="例：系統將於今晚 22:00 進行維護，預計 30 分鐘。" style="min-height:100px;">測試公告內容</textarea>
  <div>
    <button onclick="generate()">🚀 產生 PowerShell 指令</button>
    <button class="blue" onclick="copyResult()">📋 複製指令</button>
    <button class="gray" onclick="clearAll()">🧹 清空</button>
  </div>
  <div class="warn">⚠️ 本工具只產生指令，不實際發送。請複製指令到 PowerShell 執行，並自行填入 ADMIN_TOKEN。</div>
  <div class="tip">💡 Worker：<code>https://ahpal-announcements-api.praystone.workers.dev</code></div>
</div>

<div class="card">
  <label>產出結果</label>
  <div class="result" id="output">（按「產生」後，結果會出現在這裡）</div>
</div>

<div class="footer">
  <p>© 2026 雅寶社區 · 頂客論壇 (AHPAL.COM)</p>
  <p><a href="https://tools.ahpal.com/">← 回到工具箱</a></p>

<script>
function generate(){
  var title = document.getElementById('title').value.trim();
  var content = document.getElementById('content').value.trim();
  if(!title || !content){ alert('請填標題和內容'); return; }
  var lines = [];
  lines.push('$ADMIN_TOKEN = "<你的 token>"');
  lines.push('$body = @{ title = "' + title.replace(/"/g, '`"') + '"; content = "' + content.replace(/"/g, '`"') + '" } | ConvertTo-Json -Compress');
  lines.push('Invoke-WebRequest -Uri "https://ahpal-announcements-api.praystone.workers.dev/api/announcements" `');
  lines.push('    -Method POST -Headers @{ "Content-Type" = "application/json"; "X-Admin-Token" = $ADMIN_TOKEN } `');
  lines.push('    -Body $body -UseBasicParsing');
  document.getElementById('output').textContent = lines.join('\n');
}
function copyResult(){
  var t = document.getElementById('output').textContent;
  if(t.indexOf('ADMIN_TOKEN') < 0){ alert('請先產生指令'); return; }
  navigator.clipboard.writeText(t);
  alert('已複製，請貼進 PowerShell 執行');
}
function clearAll(){
  document.getElementById('title').value = '';
  document.getElementById('content').value = '';
  document.getElementById('output').textContent = '（按「產生」後，結果會出現在這裡）';
}
</script>
