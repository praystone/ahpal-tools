<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif;background:#0D1117;color:#E6EDF3;line-height:1.7;padding:20px;}
.container{max-width:1100px;margin:0 auto;}
h1{color:#D4AF37;font-size:26px;margin-bottom:8px;}
.sub{color:#8B949E;margin-bottom:16px;font-size:14px;}
.nav{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 12px;padding:10px 14px;background:linear-gradient(135deg,#161B22,#0D1117);border:1px solid #D4AF37;border-radius:10px;margin:0 0 16px 0;font-size:13px;}
.nav a{color:#58A6FF;text-decoration:none;padding:4px 8px;}
.nav a.active{color:#0D1117;background:#D4AF37;font-weight:700;}
.card{background:#161B22;border:1px solid #2D303A;border-radius:12px;padding:20px;margin-bottom:16px;}
.btn{background:#D4AF37;color:#0D1117;border:none;border-radius:8px;padding:8px 16px;font-weight:700;cursor:pointer;font-size:13px;margin:2px;}
.btn.gray{background:#2D303A;color:#E6EDF3;}
.btn.blue{background:#58A6FF;}
.btn.red{background:#F85149;color:#fff;}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
.track{background:#0D1117;border:1px solid #2D303A;border-radius:8px;padding:10px;margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.track .info{flex:1;min-width:120px;}
.track .name{color:#E6EDF3;font-size:13px;font-weight:700;}
.track .meta{color:#8B949E;font-size:11px;}
.track canvas{flex:2;height:50px;background:#161B22;border-radius:4px;cursor:pointer;}
.track .controls{display:flex;gap:4px;align-items:center;}
.track input[type=range]{width:60px;}
.track .label{color:#8B949E;font-size:10px;}
.timeline{position:relative;background:#0D1117;border:1px solid #2D303A;border-radius:8px;padding:8px;margin-top:12px;overflow-x:auto;}
.ruler{height:20px;position:relative;border-bottom:1px solid #2D303A;margin-bottom:8px;}
.ruler .tick{position:absolute;top:0;height:100%;border-left:1px solid #2D303A;font-size:9px;color:#8B949E;padding-left:2px;}
.playhead{position:absolute;top:0;width:2px;height:100%;background:#58A6FF;pointer-events:none;}
.status{background:#0D1117;border-radius:6px;padding:8px 12px;font-size:12px;color:#8B949E;margin-top:12px;min-height:30px;}
.footer{text-align:center;margin-top:30px;color:#8B949E;font-size:12px;}
.footer a{color:#58A6FF;text-decoration:none;}
.note{background:rgba(212,175,55,0.06);border-left:4px solid #D4AF37;padding:10px 14px;border-radius:6px;margin-top:12px;font-size:12px;color:#C9D1D9;}
</style>

<body>
<div class="container">
<h1>🎵 多軌音訊工作台 v2</h1>

<div class="card">
<h2 style="color:#D4AF37;font-size:16px;margin-bottom:12px;">📂 上傳音檔（可多選）</h2>
<input type="file" id="file-input" accept="audio/*" multiple>
<div class="status" id="status">尚未選擇檔案。</div>
</div>

<div class="card">
<h2 style="color:#D4AF37;font-size:16px;margin-bottom:12px;">🎛️ 混音台</h2>
<div class="controls">
<button class="btn" id="btn-play" disabled>▶️ 播放</button>
<button class="btn gray" id="btn-stop" disabled>⏹️ 停止</button>
<button class="btn gray" id="btn-clear" disabled>🗑️ 清空</button>
<button class="btn blue" id="btn-export" disabled>💾 匯出 WAV</button>
</div>
<div id="tracks"></div>
</div>

<div class="card">
<h2 style="color:#D4AF37;font-size:16px;margin-bottom:12px;">⏱️ 時間軸</h2>
<div class="timeline" id="timeline">
<div class="ruler" id="ruler"></div>
<div id="track-lanes"></div>
<div class="playhead" id="playhead" style="display:none;"></div>
</div>
<div class="status" id="time-info">時間：0.00 / 0.00 秒</div>
</div>

<div class="note">📌 第二階段：多軌、裁切（拖曳選取區間）、混音（volume/pan/mute/solo）、WAV 匯出。第三階段會加字幕時間軸與 SRT 匯出。</div>

</div>

</body>
