<div class="container">
<h1>🔧 JSON 格式化器</h1>
<p class="sub">格式化、驗證、壓縮 JSON · 完全離線</p>
<div class="toolbar">
<button class="btn btn-primary" onclick="doFormat()">格式化</button>
<button class="btn btn-primary" onclick="doMinify()">壓縮</button>
<button class="btn btn-secondary" onclick="doValidate()">驗證</button>
<button class="btn btn-secondary" onclick="doClear()">清空</button>
<button class="btn btn-secondary" onclick="doSample()">載入範例</button>
</div>
<div class="grid">
<div class="panel">
<div class="panel-header">輸入 JSON</div>
<textarea id="input" placeholder="貼上 JSON 到這裡..."></textarea>
</div>
<div class="panel">
<div class="panel-header">輸出</div>
<div class="output" id="output">格式化結果會出現在這裡</div>
</div>
</div>
<div class="msg" id="msg" style="display:none;"></div>
</div>
<script>
function $(id){return document.getElementById(id);}
function showMsg(text, ok){
  var m = $("msg");
  m.textContent = text;
  m.className = "msg " + (ok ? "ok" : "err");
  m.style.display = "block";
}
function doFormat(){
  try {
    var obj = JSON.parse($("input").value);
    $("output").textContent = JSON.stringify(obj, null, 2);
    showMsg("✅ 格式化成功", true);
  } catch(e) { showMsg("❌ 無效 JSON：" + e.message, false); }
}
function doMinify(){
  try {
    var obj = JSON.parse($("input").value);
    $("output").textContent = JSON.stringify(obj);
    showMsg("✅ 壓縮成功", true);
  } catch(e) { showMsg("❌ 無效 JSON：" + e.message, false); }
}
function doValidate(){
  try {
    JSON.parse($("input").value);
    showMsg("✅ JSON 格式正確", true);
  } catch(e) { showMsg("❌ 無效 JSON：" + e.message, false); }
}
function doClear(){
  $("input").value = "";
  $("output").textContent = "格式化結果會出現在這裡";
  $("msg").style.display = "none";
}
function doSample(){
  $("input").value = '{"name":"雅寶社區","version":"v2.5","users":["總工程師","test98"],"active":true,"stats":{"posts":11916,"comments":83}}';
}
</script>
