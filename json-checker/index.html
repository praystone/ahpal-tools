<div class="container">
<h1>🔍 JSON 對帳器</h1>
<p class="sub">上傳分類 JSON 與實體檔名清單，即時檢查幽靈登記、未登記實體、關鍵字重複。純前端，不上傳。</p>

<div class="card">
  <label>① 貼上分類 JSON（例如 data/articles/game.json）</label>
  <textarea id="jsonInput" placeholder='貼上 JSON 陣列，例如：[{"keyword":"...","filename":"game/xxx.html"}, ...]' style="min-height:100px;"></textarea>

  <label>② 貼上實體檔名清單（一行一個，例如 game/xxx.html）</label>
  <textarea id="fileInput" placeholder="game/xxx.html&#10;game/yyy.html" style="min-height:100px;"></textarea>

  <div>
    <button onclick="check()">🚀 開始對帳</button>
    <button class="blue" onclick="copyReport()">📋 複製報告</button>
    <button class="gray" onclick="clearAll()">🧹 清空</button>
  </div>
  <div class="tip">💡 純前端對帳，不上傳任何資料。判斷邏輯同 <code>check-category.py</code>。</div>
</div>

<div class="card">
  <label>對帳結果</label>
  <div class="result" id="output">（按「開始對帳」後，結果會出現在這裡）</div>
</div>

<div class="footer">
  <p>© 2026 雅寶社區 · 頂客論壇 (AHPAL.COM)</p>
  <p><a href="https://tools.ahpal.com/">← 回到工具箱</a></p>
</div>
</div>
<script>
function check(){
  var out = document.getElementById('output');
  var jsonText = document.getElementById('jsonInput').value.trim();
  var fileText = document.getElementById('fileInput').value.trim();
  if(!jsonText){ out.textContent = '請貼上 JSON'; return; }

  var arr;
  try { arr = JSON.parse(jsonText); } catch(e) { out.textContent = 'JSON 解析失敗：' + e.message; return; }
  if(!Array.isArray(arr)){ out.textContent = 'JSON 必須是陣列'; return; }

  var files = fileText ? fileText.split('\n').map(function(s){return s.trim();}).filter(function(s){return s;}) : [];

  var jsonFilenames = {};
  var kwCount = {};
  var fnCount = {};
  arr.forEach(function(item){
    var fn = (item.filename || '').replace(/^[^\/]+\//, '');
    jsonFilenames[fn] = item;
    var kw = item.keyword || '';
    kwCount[kw] = (kwCount[kw] || 0) + 1;
    fnCount[fn] = (fnCount[fn] || 0) + 1;
  });

  var fileSet = {};
  files.forEach(function(f){ fileSet[f.replace(/^[^\/]+\//, '')] = true; });

  var ghost = [];
  var unreg = [];
  Object.keys(jsonFilenames).forEach(function(fn){
    if(files.length > 0 && !fileSet[fn]) ghost.push(fn);
  });
  if(files.length > 0) {
    files.forEach(function(f){
      var fn = f.replace(/^[^\/]+\//, '');
      if(!jsonFilenames[fn]) unreg.push(f);
    });
  }

  var dupKw = Object.keys(kwCount).filter(function(k){ return kwCount[k] > 1; });
  var dupFn = Object.keys(fnCount).filter(function(k){ return fnCount[k] > 1; });

  var lines = [];
  lines.push('=== JSON 對帳報告 ===');
  lines.push('JSON 筆數：' + arr.length);
  if(files.length > 0) {
    lines.push('實體檔數：' + files.length);
    lines.push('落差：' + (arr.length - files.length) + ' 篇');
  }
  lines.push('');
  lines.push('【幽靈登記（JSON 有、實體無）】' + ghost.length + ' 筆');
  ghost.slice(0, 30).forEach(function(f){ lines.push('  - ' + f); });
  if(ghost.length > 30) lines.push('  ...（還有 ' + (ghost.length-30) + ' 筆）');
  lines.push('');
  lines.push('【未登記實體（實體有、JSON 無）】' + unreg.length + ' 筆');
  unreg.slice(0, 30).forEach(function(f){ lines.push('  - ' + f); });
  if(unreg.length > 30) lines.push('  ...（還有 ' + (unreg.length-30) + ' 筆）');
  lines.push('');
  lines.push('【關鍵字重複】' + dupKw.length + ' 筆');
  dupKw.slice(0, 20).forEach(function(k){ lines.push('  - ' + k + ' (' + kwCount[k] + ' 次)'); });
  lines.push('');
  lines.push('【檔名重複】' + dupFn.length + ' 筆');
  dupFn.slice(0, 20).forEach(function(k){ lines.push('  - ' + k + ' (' + fnCount[k] + ' 次)'); });
  lines.push('');
  lines.push('=== 結論 ===');
  if(ghost.length === 0 && unreg.length === 0 && dupKw.length === 0 && dupFn.length === 0){
    lines.push('✅ 全部通過');
  } else {
    lines.push('❌ 有問題，請修正');
  }

  out.textContent = lines.join('\n');
}
function copyReport(){
  var t = document.getElementById('output').textContent;
  if(t.indexOf('===') < 0){ alert('請先對帳'); return; }
  navigator.clipboard.writeText(t);
  alert('已複製報告');
}
function clearAll(){
  document.getElementById('jsonInput').value = '';
  document.getElementById('fileInput').value = '';
  document.getElementById('output').textContent = '（按「開始對帳」後，結果會出現在這裡）';
}
</script>
